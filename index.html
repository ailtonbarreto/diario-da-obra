<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
    <script async src="dash.js"></script>
    <title>Diario da Obra</title>
</head>

<body>

    <!-- <div class="popup" style="display: none;">

        <iframe src="https://docs.google.com/spreadsheets/d/1_HL-Yq9zmhMAP-zGtswnWEnHBklcRn9cQtle-PveFcw/edit?gid=640424636#gid=640424636" frameborder="0"></iframe>


    </div> -->


    <div class="container">


        <main>

            <div class="header">

                <div class="user">


                    <h1 id="nome_obra">Olá, Ailton</h1>

                </div>


                <div class="datas">


                    <div>

                        <span class="material-symbols-outlined">
                            edit
                        </span>

                    </div>

                </div>


            </div>


            <div class="analyse">

                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Inicio Da Obra</h3>

                        <span class="material-symbols-outlined" id="inicio">
                            date_range
                        </span>


                    </div>


                    <h1 id="data_inicio">-</h1>



                </div>


                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Tempo De Obra</h3>

                        <span class="material-symbols-outlined" id="tempo">calendar_clock</span>


                    </div>

                    <h1 id="tempo_obra_escolhido">-</h1>

                </div>


                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Qtd Dias Corridos</h3>

                        <span class="material-symbols-outlined">alarm</span>

                    </div>


                    <h1 id="qtd_dias_corridos">-</h1>

                </div>

                <div class="card_kpi">


                    <div class="kpi_header">

                        <h3>Qtd Dias Trabalhados</h3>

                        <span class="material-symbols-outlined" id="construcao">construction</span>

                    </div>


                    <h1 id="qtd_dias_trabalhados">-</h1>

                </div>

                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Previsão Término</h3>

                        <span class="material-symbols-outlined" id="termino_">calendar_check</span>


                    </div>


                    <h1 id="termino">-</h1>

                </div>

            </div>


            <div class="charts-container">

                <div class="first-section">

                    <div class="chart_card">

                        <h3>Prazo Da Obra</h3>

                        <div id="gauge" style="width:100%; height:150%;"></div>

                    </div>

                    <div class="chart_card" style="z-index: 1000;">

                        <div id="tabela_etapas"></div>

                    </div>


                </div>

                <div class="second-section">

                    <div class="chart_card">

                        <div id="cards_progresso" class="progresso-container"></div>


                    </div>

                    <div class="chart_card">

                        <h3>Evolução Da Obra</h3>

                        <div id="line" style="width:100%;height:96%;"></div>

                    </div>

                </div>


                <div>


                    <div class="chart_card" style="height:100%; width:100%;">

                        <div id="map"></div>

                    </div>


                </div>



            </div>

        </main>

    </div>

</body>


</html>
