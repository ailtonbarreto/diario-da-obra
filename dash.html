<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">
    <script async src="dash.js"></script>
    <title>Diario da Obra</title>
</head>

<body class="dark-mode-variables">


    <div class="container">


        <main>

            <div class="header">

                <div class="user">

                    <img src="./img/logo.png" alt="">
                    <h1>Olá, Ailton</h1>

                </div>


                <div class="datas">



                    <div>


                        <label>Obra: </label>

                        <select id="obra">

                            <option value="-">-</option>

                        </select>

                    </div>

                    <div class="dark-mode">

                        <span class="material-symbols-outlined active">
                            brightness_medium
                        </span>

                    </div>

                </div>


            </div>


            <div class="analyse">

                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Inicio Da Obra</h3>

                        <span class="material-symbols-outlined" id="inicio">
                            date_range
                        </span>


                    </div>


                    <h1 id="data_inicio">-</h1>



                </div>


                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Tempo De Obra</h3>

                        <span class="material-symbols-outlined" id="tempo">calendar_clock</span>


                    </div>

                    <h1 id="tempo_obra_escolhido">-</h1>

                </div>


                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Qtd Dias Corridos</h3>

                        <span class="material-symbols-outlined">alarm</span>

                    </div>


                    <h1 id="qtd_dias_corridos">-</h1>

                </div>

                <div class="card_kpi">


                    <div class="kpi_header">

                        <h3>Qtd Dias Trabalhados</h3>

                        <span class="material-symbols-outlined" id="construcao">construction</span>

                    </div>


                    <h1 id="qtd_dias_trabalhados">-</h1>

                </div>

                <div class="card_kpi">

                    <div class="kpi_header">

                        <h3>Previsão Término</h3>

                        <span class="material-symbols-outlined" id="termino_">calendar_check</span>


                    </div>


                    <h1 id="termino">-</h1>

                </div>

            </div>


            <div class="charts-container">

                <div class="first-section">

                    <div class="chart_card">

                        <h3>Prazo Da Obra</h3>

                        <div id="gauge" style="width:100%; height:150%;"></div>

                    </div>

                    <div class="chart_card">

                        <div id="map"></div>

                    </div>


                </div>

                <div class="second-section">

                    <div class="chart_card">

                        <h3>Evolução Da Obra</h3>

                        <div id="line" style="width:100%;height:96%;"></div>

                    </div>

                    <div class="chart_card">

                        <div id="tabela_etapas"></div>

                    </div>

                </div>


                <div>


                    <div class="chart_card" style="height:100%; width:100%;">

                        <iframe id="goioere" title="Goioerê" frameborder="0" allowfullscreen mozallowfullscreen="false"
                         src="https://sketchfab.com/models/9beba1de353d4abb976c0ae1f4211893/embed?autostart=1&camera=0&transparent=1"
                            style="height: 100%; width: 100%;display:none;"> </iframe> 

                        <iframe id="maringa" title="Maringá" frameborder="0" allowfullscreen mozallowfullscreen="false"
                            webkitallowfullscreen="false" allow="autoplay; fullscreen; xr-spatial-tracking"
                            xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share
                            src="https://sketchfab.com/3d-models/apartment-floor-plan-f26d324342a04991878261f334c6349a/embed"
                            style="height: 100%; width: 100%;display:none;"> </iframe>

                    </div>





                </div>



            </div>

        </main>

    </div>

</body>

<script>

    const sideMenu = document.querySelector('aside');
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');

    const darkMode = document.querySelector('.dark-mode');


    darkMode.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode-variables');
        darkMode.querySelector('span:nth-child(1)').classList.toggle('active');
    })



</script>

</html>
